[project]
name = "auto-negotiate-backend"
version = "1.0.0"
description = "Auto-Negotiate: Autonomous Sports Contract Negotiation Backend"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]

[project.dependencies]
fastapi = ">=0.111.0"
uvicorn = {version = ">=0.30.0", extras = ["standard"]}
pydantic = ">=2.0.0"
httpx = ">=0.27.0"
sse-starlette = ">=2.0.0"
langgraph = ">=0.2.0"
langchain = ">=0.2.0"
langchain-openai = ">=0.1.0"
langchain-core = ">=0.2.0"
python-dotenv = ">=1.0.0"
redis = ">=5.0.0"
